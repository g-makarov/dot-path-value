name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The toolchain (tsdown, oxlint, vitest) needs a recent Node.
        # The published package is verified separately in `compat`.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

      - run: pnpm run check:exports

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == 26
        with:
          name: dist
          path: dist

  compat:
    # Verifies the build actually runs on every Node version `engines.node` claims.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Smoke test (ESM)
        run: |
          node --input-type=module -e "
            import { getByPath, setByPath } from './dist/index.mjs';
            const o = {};
            setByPath(o, 'a.0.b', 1);
            if (getByPath(o, 'a.0.b') !== 1) throw new Error('esm: unexpected value');
            if (!Array.isArray(o.a)) throw new Error('esm: numeric segment did not create an array');
          "

      - name: Smoke test (CJS)
        run: |
          node -e "
            const { getByPath, setByPath } = require('./dist/index.cjs');
            const o = {};
            setByPath(o, 'a.0.b', 1);
            if (getByPath(o, 'a.0.b') !== 1) throw new Error('cjs: unexpected value');
            if (!Array.isArray(o.a)) throw new Error('cjs: numeric segment did not create an array');
          "
