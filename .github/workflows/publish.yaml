name: Release

on:
  push:
    tags: ['v*']

# Serialize releases, but never cancel one mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Least privilege; only `publish` widens it

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Source checkout only
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false # No cache in the release pipeline

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  # Separate job so build-time dependencies can never reach the publish job.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Source checkout only
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false # Slower, but no cache poisoning risk

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: pnpm run build

      - name: Check published exports
        run: pnpm run check:exports

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  # The critical job: no dependencies are installed at all. Anything that runs
  # here runs with `id-token: write` and could publish the package.
  publish:
    runs-on: ubuntu-latest
    needs:
      - test
      - build
    permissions:
      contents: read # Source checkout only
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN exists
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: dist/

      # Node 26 bundles npm 11.17, which has `npm stage`. Nothing is installed.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      # `npm stage publish`, not `npm publish`: CI only stages the release, a
      # human approves it on npmjs.com with 2FA. The npm trusted publisher for
      # this package is configured stage-only, so a plain publish is refused.
      - name: Stage npm release
        run: npm stage publish --ignore-scripts
