name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC). No NPM_TOKEN is used: npm trusts
  # this workflow file in this repository, and issues provenance automatically.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than what the runner ships.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # `npm publish` (not `pnpm publish`): the OIDC exchange lives in the npm CLI.
      # `prepublishOnly` runs lint, typecheck, tests, build and package linting first.
      # NODE_AUTH_TOKEN is deliberately unset — a static token would shadow OIDC.
      - run: npm publish --access public
